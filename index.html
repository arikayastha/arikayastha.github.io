<!DOCTYPE html>

<html lang="en" data-theme="light">

<head>

  <meta charset="UTF-8">

  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <meta name="description" content="Ambashri Purkayastha — researcher and academic profile.">

  <title>Ambashri Purkayastha</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">

  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <link href="https://fonts.googleapis.com/css2?family=Josefin+Sans:ital,wght@0,300;0,400;0,500;0,600;1,400&display=swap" rel="stylesheet">

  <!-- Enable with --site-bg-images: 1 in style.css and ENABLE_BG_IMAGES in main.js -->

  <!-- <link rel="preload" href="pictures/background-light.svg" as="image" type="image/svg+xml"> -->

  <!-- <link rel="preload" href="pictures/background-dark.svg" as="image" type="image/svg+xml"> -->

  <link rel="preload" href="pictures/main-light.svg" as="image" type="image/svg+xml">

  <link rel="preload" href="pictures/main-dark.svg" as="image" type="image/svg+xml">

  <link rel="stylesheet" href="assets/css/style.css">

</head>

<body class="view-home">

  <div class="bg-corners" aria-hidden="true">

    <div class="bg-corner bg-corner--left" tabindex="0">

      <img class="bg-corner__sizer bg-corner__sizer--light" src="pictures/bg-left-corner-light.png">

      <img class="bg-corner__sizer bg-corner__sizer--dark" src="pictures/bg-left-corner-dark.png">

      <span class="bg-corner__base"></span>

      <span class="bg-corner__hover"></span>

    </div>

    <div class="bg-corner bg-corner--right">

      <span class="bg-corner__base"></span>

      <span class="bg-corner__eclipse"></span>

      <span class="bg-corner__moon"></span>

      <span class="bg-corner__hover"></span>

    </div>

  </div>

 

  <canvas class="cursor-stars" id="cursor-stars" aria-hidden="true"></canvas>

 

  <main class="app">

    <div class="app-shell" id="landing-stage">

      <a href="#about" class="site-header site-header--hero" id="site-header" data-page="about" data-zone="about" aria-label="About me">

        <img class="site-header-img site-header-img--light" src="pictures/header-light.svg" alt="Ambashri Purkayastha">

        <img class="site-header-img site-header-img--dark" src="pictures/header-dark.svg" alt="">

        <img class="site-header-img site-header-img--light site-header-img--highlight" src="pictures/header-light-highlight.png" alt="">

        <img class="site-header-img site-header-img--dark site-header-img--highlight" src="pictures/header-dark-highlight.png" alt="">

      </a>

 

      <aside class="app-sidebar">

        <button class="sidebar-logo" id="sidebar-logo" type="button" aria-label="Back to home">

          <img class="sidebar-logo-img sidebar-logo-img--light" src="pictures/sideLogo-light.svg" alt="Ambashri Purkayastha">

          <img class="sidebar-logo-img sidebar-logo-img--dark" src="pictures/sideLogo-dark.svg" alt="">

        </button>

        <div class="sidebar-nav">

          <nav class="site-list" aria-label="Site pages">

            <a href="#about" class="site-list-item" data-zone="about" data-page="about">about me.</a>

            <a href="#research" class="site-list-item" data-zone="research" data-page="research">my research.</a>

            <a href="#publications" class="site-list-item" data-zone="publications" data-page="publications">publications.</a>

            <a href="#resources" class="site-list-item" data-zone="resources" data-page="resources">resources.</a>

          </nav>

          <div class="sidebar-controls">

            <button class="theme-toggle" aria-label="Toggle day/night mode">

              <svg class="icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">

                <circle cx="12" cy="12" r="5"/><path d="M12 1v2M12 21v2M4.22 4.22l1.42 1.42M18.36 18.36l1.42 1.42M1 12h2M21 12h2M4.22 19.78l1.42-1.42M18.36 5.64l1.42-1.42"/>

              </svg>

              <svg class="icon-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">

                <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/>

              </svg>

            </button>

            <button class="bg-toggle" type="button" aria-label="Turn on background images" aria-pressed="false">

              <svg class="icon-star" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">

                <path d="M12 2.5l2.63 6.87L21.5 12l-6.87 2.63L12 21.5l-2.63-6.87L2.5 12l6.87-2.63L12 2.5zm0 4.62l-1.1 2.86L8.04 11l2.86 1.1L12 15.04l1.1-2.94L15.96 11l-2.86-1.02L12 7.12z"/>

              </svg>

            </button>

            <button class="view-toggle" type="button" aria-label="Switch to simple scrolling view" aria-pressed="false">

              <svg class="icon-lines" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true">

                <path d="M4 7h16M4 12h16M4 17h10"/>

              </svg>

            </button>

          </div>

        </div>

      </aside>

 

      <div class="app-main">

        <div class="landing-view" id="landing-view">

          <div class="figure-nav" id="figure-nav" role="navigation" aria-label="Illustration navigation">

            <div class="figure-display">

              <img id="figure-base" class="figure-img" src="pictures/main-light.svg" alt="">

              <img id="figure-overlay-a" class="figure-img figure-overlay" src="" alt="Illustration — hover regions to explore">

              <img id="figure-overlay-b" class="figure-img figure-overlay" src="" alt="" aria-hidden="true">

              <div class="figure-zones">

                <a class="figure-zone" href="#publications" data-zone="publications" data-page="publications"

                   data-img-light="pictures/publication-light.svg" data-img-dark="pictures/publication-dark.svg"

                   aria-label="Publications"></a>

                <a class="figure-zone" href="#research" data-zone="research" data-page="research"

                   data-img-light="pictures/Research-light.svg" data-img-dark="pictures/Research-dark.svg"

                   aria-label="Research"></a>

                <a class="figure-zone" href="#resources" data-zone="resources" data-page="resources"

                   data-img-light="pictures/resource-light.svg" data-img-dark="pictures/resource-dark.svg"

                   aria-label="Resources"></a>

              </div>

            </div>

            <p class="figure-tagline">I study light, & how it moves through matter and space.</p>

          </div>

        </div>

 

        <article class="page-view page" id="page-view" aria-hidden="true"></article>

      </div>

    </div>

  </main>

 

  <div class="scroll-view" id="scroll-view" aria-hidden="true">

    <div class="scroll-shell">

      <aside class="scroll-sidebar">

        <div class="scroll-sidebar-inner">

          <button class="scroll-logo" id="scroll-logo" type="button" aria-label="Back to top">

            <img class="scroll-logo-img scroll-logo-img--light" src="pictures/sideLogo-light.svg" alt="Ambashri Purkayastha">

            <img class="scroll-logo-img scroll-logo-img--dark" src="pictures/sideLogo-dark.svg" alt="">

          </button>

          <div class="scroll-nav-wrap">

            <nav class="scroll-nav" aria-label="Sections">

              <a class="scroll-nav-item" href="#about" data-section="about">about me.</a>

              <a class="scroll-nav-item" href="#research" data-section="research">my research.</a>

              <a class="scroll-nav-item" href="#publications" data-section="publications">publications.</a>

              <a class="scroll-nav-item" href="#resources" data-section="resources">resources.</a>

            </nav>

            <div class="scroll-controls">

              <button class="theme-toggle" aria-label="Toggle day/night mode">

                <svg class="icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">

                  <circle cx="12" cy="12" r="5"/><path d="M12 1v2M12 21v2M4.22 4.22l1.42 1.42M18.36 18.36l1.42 1.42M1 12h2M21 12h2M4.22 19.78l1.42-1.42M18.36 5.64l1.42-1.42"/>

                </svg>

                <svg class="icon-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">

                  <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/>

                </svg>

              </button>

              <button class="view-toggle" type="button" aria-label="Switch to illustrated view" aria-pressed="true">

                <svg class="icon-lines" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true">

                  <path d="M4 7h16M4 12h16M4 17h10"/>

                </svg>

              </button>

            </div>

          </div>

        </div>

      </aside>

 

      <div class="scroll-main" id="scroll-main"></div>

    </div>

 

    <p class="scroll-tagline">I study light, &amp; how it moves through matter and space.</p>

  </div>

 

  <script src="assets/js/main.js"></script>

</body>

</html>
